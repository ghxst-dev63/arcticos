<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOIDGATE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%2308080c'/><text x='50' y='68' text-anchor='middle' font-family='monospace' font-size='50' font-weight='bold' fill='%2300ffa3'>V</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700;900&display=swap');

  :root {
    --bg: #08080c;
    --surface: #0e0e14;
    --surface2: #14141e;
    --border: #1a1a2e;
    --border-hover: #2a2a44;
    --accent: #00ffa3;
    --accent-dim: rgba(0,255,163,0.08);
    --accent-mid: rgba(0,255,163,0.25);
    --accent-glow: rgba(0,255,163,0.4);
    --danger: #ff3366;
    --warn: #ffaa33;
    --text: #e0e0e8;
    --text-dim: #555570;
    --text-mid: #8888a0;
    --glow: 0 0 20px rgba(0,255,163,0.15), 0 0 40px rgba(0,255,163,0.05);
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Tab Bar ── */
  .tab-bar {
    display: flex;
    align-items: flex-end;
    background: var(--bg);
    padding: 4px 6px 0;
    gap: 1px;
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    max-width: 180px;
    min-width: 70px;
    transition: all 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    user-select: none;
    position: relative;
  }
  .tab:hover { background: var(--surface); color: var(--text-mid); }
  .tab.active {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 1px;
    background: var(--surface);
  }
  .tab .tab-favicon {
    width: 14px; height: 14px;
    border-radius: 2px;
    flex-shrink: 0;
    object-fit: contain;
  }
  .tab .tab-title {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .tab .tab-close {
    width: 16px; height: 16px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-dim);
    flex-shrink: 0;
    transition: all 0.15s;
    opacity: 0;
  }
  .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
  .tab .tab-close:hover { background: rgba(255,51,102,0.2); color: var(--danger); }

  .tab-new {
    width: 26px; height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 2px;
    margin-left: 2px;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .tab-new:hover { background: var(--surface); color: var(--accent); border-color: var(--border); }

  /* ── Header / Toolbar ── */
  header {
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 20px var(--accent-mid);
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    transition: text-shadow 0.3s;
  }
  .logo:hover { text-shadow: 0 0 30px var(--accent-glow); }

  .nav-buttons {
    display: flex;
    gap: 1px;
    flex-shrink: 0;
  }
  .nav-btn {
    width: 30px; height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .nav-btn:active:not(:disabled) { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.2; cursor: default; }
  .nav-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .url-bar {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 4px 0 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
    min-width: 0;
  }
  .url-bar:focus-within {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }
  .url-bar .lock-icon {
    color: var(--text-dim);
    margin-right: 6px;
    flex-shrink: 0;
    width: 12px;
    height: 12px;
  }
  .url-bar input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 7px 0;
    min-width: 0;
  }
  .url-bar input::placeholder { color: var(--text-dim); }

  .go-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .go-btn:hover { filter: brightness(1.15); }
  .go-btn:active { transform: scale(0.96); }

  .toolbar-select {
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    outline: none;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.2s;
  }
  .toolbar-select:focus { border-color: var(--accent); }
  .toolbar-select option { background: var(--surface); color: var(--text); }

  /* Cloak button */
  .cloak-btn {
    width: 30px; height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    transition: all 0.15s;
    position: relative;
  }
  .cloak-btn:hover { background: var(--surface2); color: var(--accent); border-color: var(--accent); }
  .cloak-btn .tooltip {
    position: absolute;
    bottom: -32px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-mid);
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .cloak-btn:hover .tooltip { opacity: 1; }

  /* ── Status bar ── */
  .status-bar {
    padding: 4px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .status-dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.error { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .status-dot.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }

  /* ── Tab Content Panels ── */
  .tab-content { display: none; min-height: 0; }
  .tab-content.active { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  /* ── Landing ── */
  .landing {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.3s;
    padding: 24px 20px;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .landing.hidden { display: none; }

  .landing-header {
    text-align: center;
    margin-bottom: 6px;
  }
  .landing h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 40px var(--accent-mid), 0 0 80px var(--accent-dim);
    letter-spacing: 6px;
    animation: glow-pulse 3s ease-in-out infinite alternate;
    margin-bottom: 4px;
  }
  .landing p {
    color: var(--text-dim);
    font-size: 12px;
    max-width: 400px;
    text-align: center;
    line-height: 1.5;
  }
  .landing .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 2px;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-dim);
    background: var(--surface);
  }

  @keyframes glow-pulse {
    0% { text-shadow: 0 0 30px var(--accent-dim), 0 0 60px transparent; }
    100% { text-shadow: 0 0 40px var(--accent-mid), 0 0 80px var(--accent-dim); }
  }

  /* ── Quick Links ── */
  .quick-links-section {
    width: 100%;
    max-width: 680px;
  }
  .quick-links-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .quick-links-header h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .add-link-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .add-link-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .quick-links-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }

  .quick-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    text-decoration: none;
    user-select: none;
  }
  .quick-link:hover {
    border-color: var(--border-hover);
    background: var(--surface2);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .quick-link-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: #1a1a28;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .quick-link-icon svg {
    width: 26px; height: 26px;
    flex-shrink: 0;
  }
  .quick-link-icon .ql-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }
  .quick-link-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-mid);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    line-height: 1.2;
  }

  /* 3-dot menu on custom links */
  .quick-link-menu-btn {
    position: absolute;
    top: 4px; right: 4px;
    width: 18px; height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1;
    opacity: 0;
    transition: all 0.15s;
    z-index: 2;
  }
  .quick-link:hover .quick-link-menu-btn { opacity: 1; }
  .quick-link-menu-btn:hover { background: rgba(255,51,102,0.15); color: var(--danger); }

  /* ── Add Link Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fade-in 0.2s;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 360px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: modal-in 0.25s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes modal-in { from { opacity: 0; transform: scale(0.95) translateY(10px); } }
  .modal h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .modal-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .modal-field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .modal-field input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal-field input:focus { border-color: var(--accent); }
  .modal-field input::placeholder { color: var(--text-dim); }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text-dim);
    transition: all 0.15s;
  }
  .modal-btn:hover { border-color: var(--text-mid); color: var(--text); }
  .modal-btn.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 700;
  }
  .modal-btn.primary:hover { filter: brightness(1.15); }

  /* ── Viewer ── */
  .viewer {
    flex: 1;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  .viewer iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: var(--bg);
    position: absolute;
    inset: 0;
  }

  /* ── Loading ── */
  .loader {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
  }
  .loader.active { display: flex; }
  .loader .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  .loader .load-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  /* Progress bar */
  .loader .load-progress {
    width: 160px;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }
  .loader .load-progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 1px;
    transition: width 0.3s;
    box-shadow: 0 0 6px var(--accent);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error toast ── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--danger);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 8px;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    max-width: 90vw;
  }
  .toast.visible { transform: translateX(-50%) translateY(0); }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    header { flex-wrap: wrap; padding: 6px 8px; gap: 4px; }
    .logo { display: none; }
    .url-bar { order: 10; width: 100%; }
    .tab { max-width: 130px; min-width: 55px; padding: 5px 8px; font-size: 10px; }
    .quick-links-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .landing { padding: 24px 12px 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Tab Bar -->
  <div class="tab-bar" id="tabBar">
    <button class="tab-new" onclick="createTab()" title="New Tab (Ctrl+T)">+</button>
  </div>

  <!-- Toolbar -->
  <header>
    <div class="logo" onclick="goHome()">VOIDGATE</div>

    <div class="nav-buttons">
      <button class="nav-btn" id="btnBack" onclick="goBack()" disabled title="Back">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="nav-btn" id="btnForward" onclick="goForward()" disabled title="Forward">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="nav-btn" id="btnRefresh" onclick="doRefresh()" title="Refresh">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </div>

    <div class="url-bar">
      <svg class="lock-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="urlInput" type="text" placeholder="Search or enter URL..." spellcheck="false" autocomplete="off">
      <button class="go-btn" onclick="navigate()">GO</button>
    </div>

    <select class="toolbar-select" id="proxySelect" title="Proxy Mode">
      <option value="direct">Direct</option>
      <option value="corsproxy">CORS Proxy</option>
      <option value="allorigins" selected>AllOrigins</option>
      <option value="codetabs">CodeTabs</option>
    </select>

    <select class="toolbar-select" id="searchEngine" title="Search Engine">
      <option value="brave" selected>Brave</option>
      <option value="google">Google</option>
      <option value="duckduckgo">DuckDuckGo</option>
      <option value="bing">Bing</option>
    </select>

    <button class="cloak-btn" onclick="cloakTab()" title="Open in about:blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span class="tooltip">Cloak in about:blank</span>
    </button>
  </header>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Ready</span>
  </div>

  <!-- Tab content container -->
  <div id="tabContents" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Add Link Modal -->
<div class="modal-overlay" id="addLinkModal">
  <div class="modal">
    <h3>+ ADD QUICK LINK</h3>
    <div class="modal-field">
      <label>Title</label>
      <input id="linkTitle" type="text" placeholder="e.g. My Site">
    </div>
    <div class="modal-field">
      <label>URL</label>

</div>

<script>
const $ = id => document.getElementById(id);

// ── Default Quick Links ──
// ── Inline SVG icons (can't be blocked by filters) ──
const ICONS = {
  youtube: `<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="4" fill="#FF0000"/><polygon points="10,8 16,12 10,16" fill="white"/></svg>`,
  tiktok: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  roblox: `<svg viewBox="0 0 24 24" fill="none"><g transform="rotate(-15 12 12)"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="#bbb"/><rect x="9" y="9" width="6" height="6" rx="0.8" fill="#1a1a28"/></g></svg>`,
  google: `<svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>`,
  discord: `<svg viewBox="0 0 24 24" fill="none"><path d="M20.317 4.37a19.8 19.8 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.3 18.3 0 0 0-5.487 0 12.6 12.6 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.7 19.7 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.08.08 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10 10 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.8 19.8 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" fill="#5865F2"/></svg>`,
  twitch: `<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 2L2 5.5V20h5v3h3l3-3h4l5-5V2H3.5zM18.5 13l-3 3H11l-3 3v-3H4.5V4H18.5v9z" fill="#9146FF"/><path d="M15.5 7h-2v5h2V7zM11.5 7h-2v5h2V7z" fill="#9146FF"/></svg>`,
};

const DEFAULT_LINKS = [
  { title: 'YouTube',  url: 'https://www.youtube.com',  iconKey: 'youtube' },
  { title: 'TikTok',   url: 'https://www.tiktok.com',   iconKey: 'tiktok' },
  { title: 'Roblox',   url: 'https://now.gg/apps/a/19900/b.html', iconKey: 'roblox' },
  { title: 'Google',   url: 'https://www.google.com',   iconKey: 'google' },
  { title: 'Discord',  url: 'https://discord.com/app',  iconKey: 'discord' },
  { title: 'Twitch',   url: 'https://www.twitch.tv',    iconKey: 'twitch' },
];

// ── Tab State ──
let tabs = [];
let activeTabId = null;
let tabIdCounter = 0;

// ── Init ──
createTab();

// ── Get Favicon URL ──
function getFaviconUrl(urlStr) {
  try {
    const u = new URL(urlStr);
    // Use DuckDuckGo icon API - returns high quality icons
    return `https://icons.duckduckgo.com/ip3/${u.hostname}.ico`;
  } catch {
    return null;
  }
}

// ── Custom Links (localStorage) ──
function getCustomLinks() {
  try { return JSON.parse(localStorage.getItem('voidgate_custom_links') || '[]'); }
  catch { return []; }
}
function saveCustomLinks(links) {
  localStorage.setItem('voidgate_custom_links', JSON.stringify(links));
}

// ── Build Quick Links HTML ──
function buildQuickLinksHTML(tabId) {
  const customLinks = getCustomLinks();

  let defaultHTML = DEFAULT_LINKS.map(link => {
    const icon = ICONS[link.iconKey] || '';
    return `
      <div class="quick-link" onclick="navigateTo('${link.url}')">
        <div class="quick-link-icon">${icon}</div>
        <div class="quick-link-title">${link.title}</div>
      </div>`;
  }).join('');

  let customHTML = customLinks.map((link, i) => {
    const letter = (link.title || '?').charAt(0).toUpperCase();
    const escapedTitle = link.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return `
      <div class="quick-link" onclick="navigateTo('${link.url.replace(/'/g, "\\'")}')">
        <button class="quick-link-menu-btn" onclick="event.stopPropagation(); deleteCustomLink(${i})" title="Delete">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
        <div class="quick-link-icon"><span class="ql-letter">${letter}</span></div>
        <div class="quick-link-title">${escapedTitle}</div>
      </div>`;
  }).join('');

  return `
    <div class="quick-links-section">
      <div class="quick-links-header">
        <h3>Quick Links</h3>
        <button class="add-link-btn" onclick="openModal()">
          <span>+</span> Add Link
        </button>
      </div>
      <div class="quick-links-grid">
        ${defaultHTML}
        ${customHTML}
      </div>
    </div>`;
}

function navigateTo(url) {
  $('urlInput').value = url;
  navigate();
}

function openModal() {
  $('addLinkModal').classList.add('active');
  $('linkTitle').value = '';
  $('linkUrl').value = '';
  setTimeout(() => $('linkUrl').focus(), 100);
}

function closeModal() {
  $('addLinkModal').classList.remove('active');
}

function saveCustomLink() {
  let url = $('linkUrl').value.trim();
  let title = $('linkTitle').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  if (!title) {
    try { title = new URL(url).hostname.replace('www.', ''); } catch { title = url; }
  }
  const links = getCustomLinks();
  links.push({ title, url });
  saveCustomLinks(links);
  closeModal();
  refreshAllLandings();
}

function deleteCustomLink(index) {
  const links = getCustomLinks();
  if (index >= 0 && index < links.length) {
    links.splice(index, 1);
    saveCustomLinks(links);
    refreshAllLandings();
  }
}

function refreshAllLandings() {
  tabs.forEach(tab => {
    const ql = tab.landingEl.querySelector('.quick-links-section');
    if (ql) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = buildQuickLinksHTML(tab.id);
      ql.replaceWith(wrapper.firstElementChild);
    }
  });
}

// Close modal on Esc or clicking overlay
$('addLinkModal').addEventListener('click', e => { if (e.target === $('addLinkModal')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('addLinkModal').classList.contains('active')) closeModal(); });
$('linkUrl').addEventListener('keydown', e => { if (e.key === 'Enter') saveCustomLink(); });

// ── Tab Management ──
function createTab(url) {
  const id = ++tabIdCounter;
  const tab = { id, title: 'New Tab', history: [], historyIndex: -1 };

  const tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.innerHTML = `<img class="tab-favicon" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="display:none"><span class="tab-title">New Tab</span><span class="tab-close">×</span>`;
  tabEl.querySelector('.tab-title').addEventListener('click', () => switchTab(id));
  tabEl.querySelector('.tab-close').addEventListener('click', e => { e.stopPropagation(); closeTab(id); });
  tab.element = tabEl;
  $('tabBar').insertBefore(tabEl, $('tabBar').lastElementChild);

  const contentEl = document.createElement('div');
  contentEl.className = 'tab-content';
  contentEl.innerHTML = `
    <div class="landing" data-landing="${id}">
      <div class="landing-header">
        <h1>VOIDGATE</h1>
        <p>Web proxy with direct embed and CORS fallback. Hit the cloak button for stealth mode. Made by Ghxst.</p>
        <div class="tags">
          <span class="tag">Direct Mode</span>
          <span class="tag">CORS Proxy</span>
          <span class="tag">about:blank Cloak</span>
          <span class="tag">Client-Side</span>
          <span class="tag">100% Free</span>
        </div>
      </div>
      ${buildQuickLinksHTML(id)}
    </div>
    <div class="viewer">
      <div class="loader" data-loader="${id}">
        <div class="spinner"></div>
        <div class="load-text" data-loadtext="${id}">Connecting through proxy...</div>
        <div class="load-progress"><div class="load-progress-bar" data-progress="${id}"></div></div>
      </div>
      <iframe data-frame="${id}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"></iframe>
    </div>
  `;
  $('tabContents').appendChild(contentEl);

  tab.contentEl = contentEl;
  tab.iframeEl = contentEl.querySelector(`[data-frame="${id}"]`);
  tab.loaderEl = contentEl.querySelector(`[data-loader="${id}"]`);
  tab.loadTextEl = contentEl.querySelector(`[data-loadtext="${id}"]`);
  tab.progressEl = contentEl.querySelector(`[data-progress="${id}"]`);
  tab.landingEl = contentEl.querySelector(`[data-landing="${id}"]`);

  tabs.push(tab);
  switchTab(id);

  if (url) {
    $('urlInput').value = url;
    navigate();
  }
  return tab;
}

function switchTab(id) {
  activeTabId = id;
  tabs.forEach(t => {
    t.element.classList.toggle('active', t.id === id);
    t.contentEl.classList.toggle('active', t.id === id);
  });
  const tab = getTab(id);
  if (tab) {
    const url = tab.history[tab.historyIndex] || '';
    $('urlInput').value = url;
    updateNavButtons();
    setStatus(url ? 'active' : '', url ? `Loaded: ${truncate(url, 70)}` : 'Ready');
  }
}

function closeTab(id) {
  if (tabs.length === 1) { goHome(); return; }
  const idx = tabs.findIndex(t => t.id === id);
  const tab = tabs[idx];
  tab.element.remove();
  tab.contentEl.remove();
  tabs.splice(idx, 1);
  if (activeTabId === id) switchTab(tabs[Math.min(idx, tabs.length - 1)].id);
}

function getTab(id) { return tabs.find(t => t.id === id); }
function activeTab() { return getTab(activeTabId); }

// ── Navigation ──
$('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') navigate(); });

function navigate() {
  let raw = $('urlInput').value.trim();
  if (!raw) return;

  if (!/^https?:\/\//i.test(raw)) {
    if (/^[\w-]+(\.[\w-]+)+/.test(raw)) {
      raw = 'https://' + raw;
    } else {
      raw = SEARCH_ENGINES[$('searchEngine').value](raw);
    }
  }

  $('urlInput').value = raw;
  const tab = activeTab();
  if (tab.historyIndex < tab.history.length - 1) {
    tab.history = tab.history.slice(0, tab.historyIndex + 1);
  }
  tab.history.push(raw);
  tab.historyIndex = tab.history.length - 1;
  fetchPage(tab, raw);
}

function goBack() {
  const tab = activeTab();
  if (tab.historyIndex > 0) {
    tab.historyIndex--;
    const url = tab.history[tab.historyIndex];
    $('urlInput').value = url;
    fetchPage(tab, url);
  }
}

function goForward() {
  const tab = activeTab();
  if (tab.historyIndex < tab.history.length - 1) {
    tab.historyIndex++;
    const url = tab.history[tab.historyIndex];
    $('urlInput').value = url;
    fetchPage(tab, url);
  }
}

function doRefresh() {
  const tab = activeTab();
  const url = tab.history[tab.historyIndex];
  if (url) fetchPage(tab, url);
}

function updateNavButtons() {
  const tab = activeTab();
  $('btnBack').disabled = !tab || tab.historyIndex <= 0;
  $('btnForward').disabled = !tab || tab.historyIndex >= tab.history.length - 1;
}

// ── Progress Animation ──
function animateProgress(tab, targetPct) {
  if (tab.progressEl) tab.progressEl.style.width = targetPct + '%';
}

// ── REPLACED_FETCH ──
function fetchWithTimeout(url, ms) {
  return Promise.race([
    fetch(url),
    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), ms))
  ]);
}

// Race ALL CORS proxies simultaneously — fastest one wins
function fetchRacingProxies(url) {
  return new Promise((resolve, reject) => {
    let settled = false;
    let failures = 0;
    const total = CORS_BACKENDS.length;
    CORS_BACKENDS.forEach(key => {
      const proxyURL = PROXIES[key](url);
      fetchWithTimeout(proxyURL, 10000).then(resp => {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        if (!settled) { settled = true; resolve({ resp, usedProxy: key }); }
      }).catch(() => {
        failures++;
        if (failures === total && !settled) reject(new Error('All proxies failed'));
      });
    });
  });
}

async function fetchPage(tab, url) {
  const mode = $('proxySelect').value;

  setStatus('active', 'Loading: ' + truncate(url, 70));
  tab.landingEl.classList.add('hidden');
  updateNavButtons();

  // Update tab title & favicon
  try {
    const hostname = new URL(url).hostname.replace('www.', '');
    tab.title = hostname;
    tab.element.querySelector('.tab-title').textContent = hostname;
    const favImg = tab.element.querySelector('.tab-favicon');
    favImg.src = getFaviconUrl(url);
    favImg.style.display = 'block';
    favImg.onerror = function() { this.style.display = 'none'; };
  } catch (e) {
    tab.element.querySelector('.tab-title').textContent = 'Loading...';
  }

  // ── DIRECT MODE: fastest, loads full site with JS/CSS/images ──
  if (mode === 'direct') {
    showLoader(tab, 'Loading directly...');
    animateProgress(tab, 50);
    tab.iframeEl.onload = function() {
      animateProgress(tab, 100);
      setTimeout(function() { hideLoader(tab); }, 100);
      setStatus('active', 'Loaded: ' + truncate(url, 70));
      try {
        if (tab.iframeEl.contentDocument && tab.iframeEl.contentDocument.title) {
          tab.title = tab.iframeEl.contentDocument.title;
          tab.element.querySelector('.tab-title').textContent = tab.iframeEl.contentDocument.title;
        }
      } catch (e) {}
    };
    tab.iframeEl.src = url;
    return;
  }

  // ── CORS PROXY MODE: race all backends in parallel ──
  showLoader(tab, 'Racing proxies...');
  animateProgress(tab, 15);

  try {
    var result;
    // Try selected proxy first with short timeout, then race all
    try {
      var proxyURL = PROXIES[mode](url);
      var resp = await fetchWithTimeout(proxyURL, 6000);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      result = { resp: resp, usedProxy: mode };
    } catch (e) {
      tab.loadTextEl.textContent = 'Racing all proxies...';
      result = await fetchRacingProxies(url);
    }

    tab.loadTextEl.textContent = 'Connected via ' + result.usedProxy;
    animateProgress(tab, 60);

    var ct = result.resp.headers.get('content-type') || '';

    if (ct.includes('text/html') || ct === '') {
      animateProgress(tab, 75);
      var html = await result.resp.text();

      // Extract page title
      var titleMatch = html.match(/<title[^>]*>([^<]*)<\/title>/i);
      if (titleMatch && titleMatch[1].trim()) {
        var pageTitle = titleMatch[1].trim()
          .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
          .replace(/&#39;/g,"'").replace(/&quot;/g,'"');
        tab.title = pageTitle;
        tab.element.querySelector('.tab-title').textContent = pageTitle;
      }

      animateProgress(tab, 90);
      html = rewriteHTML(html, url);
      tab.iframeEl.srcdoc = html;
    } else if (ct.includes('image') || ct.includes('pdf')) {
      animateProgress(tab, 90);
      tab.iframeEl.src = URL.createObjectURL(await result.resp.blob());
    } else {
      animateProgress(tab, 90);
      var txt = await result.resp.text();
      tab.iframeEl.srcdoc = '<html><body style="background:#08080c;color:#e0e0e8;font-family:monospace;padding:20px;"><pre style="white-space:pre-wrap;word-break:break-all;">' + escapeHtml(txt) + '</pre></body></html>';
    }

    tab.iframeEl.onload = function() {
      animateProgress(tab, 100);
      setTimeout(function() { hideLoader(tab); }, 100);
      setStatus('active', 'Loaded: ' + truncate(url, 70));
    };

  } catch (err) {
    hideLoader(tab);
    setStatus('error', 'Failed: ' + err.message);
    showToast('Proxy failed: ' + err.message + '. Try a different mode.');
  }
}

// ── HTML Rewriting (lightweight — no resource proxying for speed) ──
function rewriteHTML(html, pageURL) {
  var base = new URL(pageURL);
  var baseHref = base.origin + base.pathname.replace(/\/[^/]*$/, '/');
  var baseTag = '<base href="' + baseHref + '" target="_self">';

  if (/<head[^>]*>/i.test(html)) {
    html = html.replace(/<head([^>]*)>/i, '<head$1>' + baseTag);
  } else if (/<html[^>]*>/i.test(html)) {
    html = html.replace(/<html([^>]*)>/i, '<html$1><head>' + baseTag + '</head>');
  } else {
    html = baseTag + html;
  }

  // Remove things that block proxied content
  html = html.replace(/<meta[^>]*http-equiv=["']?Content-Security-Policy["']?[^>]*>/gi, '');
  html = html.replace(/\s+integrity=["'][^"']*["']/gi, '');
  html = html.replace(/\s+crossorigin(?:=["'][^"']*["'])?/gi, '');

  // Intercept link clicks and form submissions
  var interceptScript = '<script>' +
    'document.addEventListener("click",function(e){' +
      'var link=e.target.closest("a[href]");' +
      'if(link){var href=link.getAttribute("href");' +
        'if(href&&href.charAt(0)!=="#"&&href.indexOf("javascript:")!==0&&href.indexOf("mailto:")!==0){' +
          'e.preventDefault();' +
          'try{var r=new URL(href,document.baseURI).href;' +
          'window.parent.postMessage({type:"navigate",url:r},"*");}catch(x){}' +
        '}' +
      '}' +
    '},true);' +
    'document.addEventListener("submit",function(e){' +
      'var f=e.target;' +
      'if(f.method==="get"||!f.method){' +
        'e.preventDefault();' +
        'try{var a=f.action||document.baseURI;' +
        'var p=new URLSearchParams(new FormData(f)).toString();' +
        'var u=a+(a.indexOf("?")>-1?"&":"?")+p;' +
        'window.parent.postMessage({type:"navigate",url:u},"*");}catch(x){}' +
      '}' +
    '},true);' +
  '<\/script>';

  if (/<\/body>/i.test(html)) {
    html = html.replace(/<\/body>/i, interceptScript + '</body>');
  } else {
    html += interceptScript;
  }
  return html;
}

// ── Message listener for in-frame navigation ──
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'navigate' && e.data.url) {
    $('urlInput').value = e.data.url;
    const tab = activeTab();
    if (tab.historyIndex < tab.history.length - 1) {
      tab.history = tab.history.slice(0, tab.historyIndex + 1);
    }
    tab.history.push(e.data.url);
    tab.historyIndex = tab.history.length - 1;
    fetchPage(tab, e.data.url);
  }
});

// ── About:blank Cloaking ──
function cloakTab() {
  const win = window.open('about:blank', '_blank');
  if (!win) {
    showToast('Pop-up blocked — allow pop-ups for this site and try again.');
    return;
  }
  const iframe = win.document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;border:none;margin:0;padding:0;z-index:999999;';
  iframe.src = window.location.href;
  win.document.body.style.cssText = 'margin:0;padding:0;overflow:hidden;';
  win.document.body.appendChild(iframe);
  win.document.title = 'Google Docs';
  try {
    const link = win.document.createElement('link');
    link.rel = 'icon';
    link.href = 'https://iili.io/fs8PgNj.png';
    win.document.head.appendChild(link);
  } catch {}
  showToast('Cloaked tab opened — you can close this original tab.');
}

// ── Helpers ──
function goHome() {
  const tab = activeTab();
  tab.iframeEl.srcdoc = '';
  tab.iframeEl.src = 'about:blank';
  tab.landingEl.classList.remove('hidden');
  tab.title = 'New Tab';
  tab.element.querySelector('.tab-title').textContent = 'New Tab';
  const favImg = tab.element.querySelector('.tab-favicon');
  if (favImg) favImg.style.display = 'none';
  tab.history = [];
  tab.historyIndex = -1;
  $('urlInput').value = '';
  setStatus('', 'Ready');
  updateNavButtons();
  // Refresh quick links in case custom links changed
  const ql = tab.landingEl.querySelector('.quick-links-section');
  if (ql) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = buildQuickLinksHTML(tab.id);
    ql.replaceWith(wrapper.firstElementChild);
  }
}

function setStatus(state, text) {
  $('statusDot').className = 'status-dot' + (state ? ' ' + state : '');
  $('statusText').textContent = text;
}

function showLoader(tab, msg) {
  tab.loadTextEl.textContent = msg || 'Loading...';
  tab.progressEl.style.width = '0%';
  tab.loaderEl.classList.add('active');
}
function hideLoader(tab) {
  tab.loaderEl.classList.remove('active');
  tab.progressEl.style.width = '0%';
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('visible'), 4000);
}

function truncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Keyboard Shortcuts ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 't') { e.preventDefault(); createTab(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'w') { e.preventDefault(); closeTab(activeTabId); }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goForward(); }
  if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r')) { e.preventDefault(); doRefresh(); }
});

// ── Auto-cloak page title ──
let disguiseEnabled = false;
document.addEventListener('keydown', e => {
  // Ctrl+Shift+H to toggle disguise
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'H') {
    e.preventDefault();
    disguiseEnabled = !disguiseEnabled;
    if (disguiseEnabled) {
      document.title = 'Google Docs';
      try {
        const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.rel = 'icon';
        link.href = 'https://iili.io/fs8PgNj.png';
        document.head.appendChild(link);
      } catch {}
      showToast('Tab disguised as Google Classroom (Ctrl+Shift+H to toggle)');
    } else {
      document.title = 'VOIDGATE';
      showToast('Disguise removed');
    }
  }
});
</script>
